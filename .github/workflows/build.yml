name: Build RootHide Deb

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        uses: waruhachi/theos-action@v2.6.3
        with:
          theos-src: roothide/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Build RootHide package
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: LockColorSwitch-roothide-deb
          path: packages/*.deb
          if-no-files-found: error
